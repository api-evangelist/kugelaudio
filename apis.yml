aid: kugelaudio
name: KugelAudio
description: >-
  KugelAudio is a Y Combinator-backed, Germany-based voice AI company (KugelAudio
  GmbH) offering low-latency text-to-speech built, trained, and hosted entirely in
  the European Union. Its kugel-3 and kugel-2-turbo models produce natural speech
  in 26+ languages with accent and dialect coverage, voice cloning from a short
  reference sample, per-project pronunciation dictionaries with IPA support,
  word-level timestamps, and inline break, spell, and prosody tags. The platform
  positions EU data sovereignty as its core differentiator, operating outside the
  reach of the US CLOUD Act and offering a direct EU endpoint plus on-premise and
  dedicated deployment. The developer surface is a REST API for generation,
  voices, models, and dictionaries plus three WebSocket streaming channels tuned
  for real-time voice agents, including token-by-token input, barge-in, and up to
  20 concurrent contexts per connection. Drop-in compatibility surfaces let
  ElevenLabs-compatible SDKs, LiveKit, PipeCat, and Vapi integrations point at
  KugelAudio without rewrites.
