openapi: 3.2.0
info:
  description: 'The public REST API of KugelAudio text to speech: synthesis, models, voices, pronunciation dictionaries, projects, and the ElevenLabs-compatible endpoints. Streaming over WebSocket (`/ws/tts`, `/ws/tts/stream`, `/ws/tts/multi`) is described in the API reference, not here. Guides and examples: https://docs.kugelaudio.com/api-reference/introduction'
  title: KugelAudio Models API
  version: v1
servers:
- description: Default, geo-routed
  url: https://api.kugelaudio.com
- description: Direct EU endpoint
  url: https://api.eu.kugelaudio.com
tags:
- externalDocs:
    url: https://docs.kugelaudio.com/api-reference/endpoints/models
  name: Models
paths:
  /v1/models:
    get:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/models'
      operationId: get_models_v1_models_get
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelsResponse'
          description: Successful Response
      security: []
      summary: Get Models
      tags:
      - Models
components:
  schemas:
    ModelInfo:
      description: Public catalog entry for one TTS model.
      properties:
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: string
        max_input_length:
          default: 5000
          title: Max Input Length
          type: integer
        model_id:
          title: Model Id
          type: string
        name:
          title: Name
          type: string
        parameters:
          anyOf:
          - type: string
          - type: 'null'
          title: Parameters
        sample_rate:
          default: 24000
          title: Sample Rate
          type: integer
      required:
      - id
      - model_id
      - name
      title: ModelInfo
      type: object
    ModelsResponse:
      description: List of available models.
      properties:
        models:
          items:
            $ref: '#/components/schemas/ModelInfo'
          title: Models
          type: array
      required:
      - models
      title: ModelsResponse
      type: object
  securitySchemes:
    ApiKeyHeader:
      description: Your API key in the `X-API-Key` header.
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      description: 'Your API key as `Authorization: Bearer YOUR_API_KEY`.'
      scheme: bearer
      type: http
    ElevenLabsApiKey:
      description: Your KugelAudio API key in the ElevenLabs `xi-api-key` header.
      in: header
      name: xi-api-key
      type: apiKey
externalDocs:
  url: https://docs.kugelaudio.com/api-reference/introduction
