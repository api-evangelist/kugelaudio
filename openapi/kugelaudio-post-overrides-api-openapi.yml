openapi: 3.1.0
info:
  title: KugelAudio TTS 11labs Post Overrides API
  description: 'Unified API: REST + WebSocket + ElevenLabs + Vapi'
  version: 2.0.0
tags:
- name: Post Overrides
paths:
  /v1/post-overrides/reload:
    post:
      summary: Reload Post Overrides
      description: 'Drop the post-override snapshot cache for immediate effect.


        Called by the admin web app after a rule changes so the next

        ``/v1/normalize`` observes it instead of waiting out the early TTL.'
      operationId: reload_post_overrides_v1_post_overrides_reload_post
      responses:
        '204':
          description: Successful Response
      tags:
      - Post Overrides
