openapi: 3.1.0
info:
  title: KugelAudio TTS 11labs Normalize API
  description: 'Unified API: REST + WebSocket + ElevenLabs + Vapi'
  version: 2.0.0
tags:
- name: Normalize
paths:
  /v1/normalize:
    post:
      summary: Normalize
      description: 'Run text through the TN pipeline (admin testing surface).


        The admin web app uses this to test post-override rules: normalize,

        diff, add a rule, ``/v1/post-overrides/reload``, normalize again.

        The LM path is used when wired; on LM failure the heuristic path

        answers instead so the testing surface stays available (matching

        v1). Post-overrides apply on both paths via the runtime''s wrapped

        normalizers.'
      operationId: normalize_v1_normalize_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizeRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizeResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      tags:
      - Normalize
components:
  schemas:
    NormalizeResponse:
      properties:
        text:
          type: string
          title: Text
        language:
          type: string
          title: Language
        time_ms:
          type: number
          title: Time Ms
      type: object
      required:
      - text
      - language
      - time_ms
      title: NormalizeResponse
      description: Admin TN test response.
    NormalizeRequest:
      properties:
        text:
          type: string
          maxLength: 10000
          minLength: 1
          title: Text
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
      type: object
      required:
      - text
      title: NormalizeRequest
      description: Admin TN test request (``POST /v1/normalize``).
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
