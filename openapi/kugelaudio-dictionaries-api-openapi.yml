openapi: 3.2.0
info:
  description: 'The public REST API of KugelAudio text to speech: synthesis, models, voices, pronunciation dictionaries, projects, and the ElevenLabs-compatible endpoints. Streaming over WebSocket (`/ws/tts`, `/ws/tts/stream`, `/ws/tts/multi`) is described in the API reference, not here. Guides and examples: https://docs.kugelaudio.com/api-reference/introduction'
  title: KugelAudio Dictionaries API
  version: v1
servers:
- description: Default, geo-routed
  url: https://api.kugelaudio.com
- description: Direct EU endpoint
  url: https://api.eu.kugelaudio.com
tags:
- externalDocs:
    url: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries
  name: Dictionaries
paths:
  /v1/dictionaries:
    get:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: list_dictionaries_v1_dictionaries_get
      parameters:
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: List Dictionaries
      tags:
      - Dictionaries
    post:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: create_dictionary_v1_dictionaries_post
      parameters:
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDictionaryRequest'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Create Dictionary
      tags:
      - Dictionaries
  /v1/dictionaries/{dict_id}:
    delete:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: delete_dictionary_v1_dictionaries__dict_id__delete
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingress__routes__dictionaries__DeleteResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Delete Dictionary
      tags:
      - Dictionaries
    get:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: get_dictionary_v1_dictionaries__dict_id__get
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Get Dictionary
      tags:
      - Dictionaries
    patch:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: update_dictionary_v1_dictionaries__dict_id__patch
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDictionaryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Update Dictionary
      tags:
      - Dictionaries
  /v1/dictionaries/{dict_id}/entries:
    get:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: list_entries_v1_dictionaries__dict_id__entries_get
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      - in: query
        name: search
        required: false
        schema:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Search
      - in: query
        name: limit
        required: false
        schema:
          default: 100
          maximum: 500
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryListResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: List Entries
      tags:
      - Dictionaries
    post:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: add_entry_v1_dictionaries__dict_id__entries_post
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EntryPayload'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Add Entry
      tags:
      - Dictionaries
    put:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: bulk_replace_entries_v1_dictionaries__dict_id__entries_put
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkReplaceEntriesRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkReplaceResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Bulk Replace Entries
      tags:
      - Dictionaries
  /v1/dictionaries/{dict_id}/entries/{entry_id}:
    delete:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: delete_entry_v1_dictionaries__dict_id__entries__entry_id__delete
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: path
        name: entry_id
        required: true
        schema:
          title: Entry Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ingress__routes__dictionaries__DeleteResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Delete Entry
      tags:
      - Dictionaries
    patch:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/dictionaries'
      operationId: update_entry_v1_dictionaries__dict_id__entries__entry_id__patch
      parameters:
      - in: path
        name: dict_id
        required: true
        schema:
          title: Dict Id
          type: integer
      - in: path
        name: entry_id
        required: true
        schema:
          title: Entry Id
          type: integer
      - in: query
        name: project_id
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Project Id
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEntryRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DictionaryEntryResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Update Entry
      tags:
      - Dictionaries
components:
  schemas:
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    UpdateDictionaryRequest:
      additionalProperties: false
      description: Patch an existing dictionary. project_id cannot be changed.
      properties:
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        is_active:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Is Active
        language:
          anyOf:
          - maxLength: 16
            type: string
          - type: 'null'
          title: Language
        name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Name
      title: UpdateDictionaryRequest
      type: object
    DictionaryResponse:
      description: A single dictionary record.
      properties:
        created_at:
          title: Created At
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        id:
          title: Id
          type: integer
        is_active:
          title: Is Active
          type: boolean
        language:
          anyOf:
          - type: string
          - type: 'null'
          title: Language
        name:
          title: Name
          type: string
        project_id:
          title: Project Id
          type: integer
        updated_at:
          title: Updated At
          type: string
      required:
      - id
      - project_id
      - name
      - is_active
      - created_at
      - updated_at
      title: DictionaryResponse
      type: object
    EntryPayload:
      additionalProperties: false
      description: Fields shared by single-entry create and bulk-replace items.
      properties:
        case_sensitive:
          default: false
          title: Case Sensitive
          type: boolean
        ipa:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Ipa
        replacement:
          maxLength: 1000
          minLength: 1
          title: Replacement
          type: string
        word:
          maxLength: 200
          minLength: 1
          title: Word
          type: string
      required:
      - word
      - replacement
      title: EntryPayload
      type: object
    BulkReplaceEntriesRequest:
      additionalProperties: false
      description: 'Atomic upsert + delete-missing replacement of all entries in a dictionary.


        Idempotent: callers sending the same payload twice converge to the

        same final state. Entries in the existing dictionary whose ``word``

        is not in ``entries`` are deleted; entries whose ``word`` matches

        are upserted.'
      properties:
        entries:
          items:
            $ref: '#/components/schemas/EntryPayload'
          title: Entries
          type: array
      required:
      - entries
      title: BulkReplaceEntriesRequest
      type: object
    UpdateEntryRequest:
      additionalProperties: false
      description: Patch an existing entry.
      properties:
        case_sensitive:
          anyOf:
          - type: boolean
          - type: 'null'
          title: Case Sensitive
        ipa:
          anyOf:
          - maxLength: 200
            type: string
          - type: 'null'
          title: Ipa
        replacement:
          anyOf:
          - maxLength: 1000
            minLength: 1
            type: string
          - type: 'null'
          title: Replacement
        word:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Word
      title: UpdateEntryRequest
      type: object
    ingress__routes__dictionaries__DeleteResponse:
      description: Response for delete operations (200 + body so JS SDKs can JSON-parse).
      properties:
        deleted:
          default: true
          title: Deleted
          type: boolean
      title: DeleteResponse
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    CreateDictionaryRequest:
      additionalProperties: false
      description: Create a new dictionary scoped to a project.
      properties:
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        language:
          anyOf:
          - maxLength: 16
            type: string
          - type: 'null'
          description: BCP-47 language tag (e.g. 'en', 'de-DE'). Omit for all languages.
          title: Language
        name:
          maxLength: 200
          minLength: 1
          title: Name
          type: string
      required:
      - name
      title: CreateDictionaryRequest
      type: object
    BulkReplaceResponse:
      description: Counts of what changed during bulk replace.
      properties:
        deleted:
          title: Deleted
          type: integer
        total:
          title: Total
          type: integer
        upserted:
          title: Upserted
          type: integer
      required:
      - upserted
      - deleted
      - total
      title: BulkReplaceResponse
      type: object
    DictionaryListResponse:
      description: List of dictionaries for a project.
      properties:
        dictionaries:
          items:
            $ref: '#/components/schemas/DictionaryResponse'
          title: Dictionaries
          type: array
      required:
      - dictionaries
      title: DictionaryListResponse
      type: object
    DictionaryEntryResponse:
      description: A single dictionary entry.
      properties:
        case_sensitive:
          title: Case Sensitive
          type: boolean
        created_at:
          title: Created At
          type: string
        dictionary_id:
          title: Dictionary Id
          type: integer
        id:
          title: Id
          type: integer
        ipa:
          anyOf:
          - type: string
          - type: 'null'
          title: Ipa
        replacement:
          title: Replacement
          type: string
        updated_at:
          title: Updated At
          type: string
        word:
          title: Word
          type: string
      required:
      - id
      - dictionary_id
      - word
      - replacement
      - case_sensitive
      - created_at
      - updated_at
      title: DictionaryEntryResponse
      type: object
    DictionaryEntryListResponse:
      description: Paginated list of dictionary entries.
      properties:
        entries:
          items:
            $ref: '#/components/schemas/DictionaryEntryResponse'
          title: Entries
          type: array
        limit:
          title: Limit
          type: integer
        offset:
          title: Offset
          type: integer
        total:
          title: Total
          type: integer
      required:
      - entries
      - total
      - limit
      - offset
      title: DictionaryEntryListResponse
      type: object
  securitySchemes:
    ApiKeyHeader:
      description: Your API key in the `X-API-Key` header.
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      description: 'Your API key as `Authorization: Bearer YOUR_API_KEY`.'
      scheme: bearer
      type: http
    ElevenLabsApiKey:
      description: Your KugelAudio API key in the ElevenLabs `xi-api-key` header.
      in: header
      name: xi-api-key
      type: apiKey
externalDocs:
  url: https://docs.kugelaudio.com/api-reference/introduction
x-provenance:
  method: harvested
  publisher: KugelAudio
  source: https://docs.kugelaudio.com/openapi.json
  note: split by refine-openapis from the provider's own published document, verified by fetch (openapi/_original/*.fetch.json);
    stamped by stamp-openapi-provenance.py (roadmap#793)
