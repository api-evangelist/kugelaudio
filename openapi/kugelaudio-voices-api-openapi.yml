openapi: 3.2.0
info:
  description: 'The public REST API of KugelAudio text to speech: synthesis, models, voices, pronunciation dictionaries, projects, and the ElevenLabs-compatible endpoints. Streaming over WebSocket (`/ws/tts`, `/ws/tts/stream`, `/ws/tts/multi`) is described in the API reference, not here. Guides and examples: https://docs.kugelaudio.com/api-reference/introduction'
  title: KugelAudio Voices API
  version: v1
servers:
- description: Default, geo-routed
  url: https://api.kugelaudio.com
- description: Direct EU endpoint
  url: https://api.eu.kugelaudio.com
tags:
- externalDocs:
    url: https://docs.kugelaudio.com/api-reference/endpoints/voices
  name: Voices
paths:
  /v1/voices:
    get:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: get_voices_v1_voices_get
      parameters:
      - in: query
        name: limit
        required: false
        schema:
          default: 20
          maximum: 100
          minimum: 1
          title: Limit
          type: integer
      - in: query
        name: offset
        required: false
        schema:
          default: 0
          minimum: 0
          title: Offset
          type: integer
      - in: query
        name: language
        required: false
        schema:
          anyOf:
          - maxLength: 35
            type: string
          - type: 'null'
          title: Language
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoicesResponse'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Get Voices
      tags:
      - Voices
    post:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: create_voice_v1_voices_post
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDetailInfo'
          description: Successful Response
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Create Voice
      tags:
      - Voices
  /v1/voices/{voice_id}:
    delete:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: delete_voice_v1_voices__voice_id__delete
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Delete Voice
      tags:
      - Voices
    get:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: get_voice_by_id_v1_voices__voice_id__get
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceInfo'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Get Voice By Id
      tags:
      - Voices
    patch:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: update_voice_v1_voices__voice_id__patch
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateVoiceRequest'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDetailInfo'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Update Voice
      tags:
      - Voices
  /v1/voices/{voice_id}/avatar:
    put:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: upload_voice_avatar_v1_voices__voice_id__avatar_put
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_voice_avatar_v1_voices__voice_id__avatar_put'
        required: true
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadedAvatarInfo'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Upload Voice Avatar
      tags:
      - Voices
  /v1/voices/{voice_id}/generate-sample:
    post:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: generate_voice_sample_v1_voices__voice_id__generate_sample_post
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GeneratedSampleInfo'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Generate Voice Sample
      tags:
      - Voices
  /v1/voices/{voice_id}/publish:
    post:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: publish_voice_v1_voices__voice_id__publish_post
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceDetailInfo'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Publish Voice
      tags:
      - Voices
  /v1/voices/{voice_id}/references:
    get:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: list_voice_references_v1_voices__voice_id__references_get
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      responses:
        '200':
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/VoiceReferenceInfo'
                title: Response List Voice References V1 Voices  Voice Id  References Get
                type: array
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: List Voice References
      tags:
      - Voices
    post:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: upload_voice_reference_v1_voices__voice_id__references_post
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_voice_reference_v1_voices__voice_id__references_post'
        required: true
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VoiceReferenceInfo'
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Upload Voice Reference
      tags:
      - Voices
  /v1/voices/{voice_id}/references/{ref_id}:
    delete:
      description: 'Reference: https://docs.kugelaudio.com/api-reference/endpoints/voices'
      operationId: delete_voice_reference_v1_voices__voice_id__references__ref_id__delete
      parameters:
      - in: path
        name: voice_id
        required: true
        schema:
          title: Voice Id
          type: string
      - in: path
        name: ref_id
        required: true
        schema:
          title: Ref Id
          type: integer
      responses:
        '204':
          description: Successful Response
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
          description: Validation Error
      security:
      - BearerAuth: []
      - ApiKeyHeader: []
      summary: Delete Voice Reference
      tags:
      - Voices
components:
  schemas:
    ValidationError:
      properties:
        ctx:
          title: Context
          type: object
        input:
          title: Input
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          title: Location
          type: array
        msg:
          title: Message
          type: string
        type:
          title: Error Type
          type: string
      required:
      - loc
      - msg
      - type
      title: ValidationError
      type: object
    VoiceReferenceInfo:
      description: Voice reference audio metadata.
      properties:
        audio_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Audio Url
        id:
          title: Id
          type: integer
        is_generated:
          default: false
          title: Is Generated
          type: boolean
        name:
          default: ''
          title: Name
          type: string
        reference_text:
          default: ''
          title: Reference Text
          type: string
        s3_path:
          default: ''
          title: S3 Path
          type: string
        voice_id:
          title: Voice Id
          type: integer
      required:
      - id
      - voice_id
      title: VoiceReferenceInfo
      type: object
    Body_upload_voice_reference_v1_voices__voice_id__references_post:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
        reference_text:
          default: ''
          title: Reference Text
          type: string
        speaker_consent:
          default: false
          title: Speaker Consent
          type: boolean
      required:
      - file
      title: Body_upload_voice_reference_v1_voices__voice_id__references_post
      type: object
    UploadedAvatarInfo:
      description: Stored avatar location returned after upload.
      properties:
        avatar_s3_path:
          title: Avatar S3 Path
          type: string
      required:
      - avatar_s3_path
      title: UploadedAvatarInfo
      type: object
    VoiceDetailInfo:
      description: Extended voice metadata returned by CRUD endpoints.
      properties:
        age:
          anyOf:
          - type: string
          - type: 'null'
          title: Age
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        category:
          default: cloned
          title: Category
          type: string
        description:
          default: ''
          title: Description
          type: string
        generative_voice_description:
          default: ''
          title: Generative Voice Description
          type: string
        handle:
          anyOf:
          - type: string
          - type: 'null'
          title: Handle
        id:
          title: Id
          type: integer
        is_public:
          default: false
          title: Is Public
          type: boolean
        name:
          title: Name
          type: string
        pending_verification:
          default: false
          title: Pending Verification
          type: boolean
        public_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Id
        quality:
          default: mid
          title: Quality
          type: string
        sample_text:
          default: ''
          title: Sample Text
          type: string
        sample_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Sample Url
        sex:
          anyOf:
          - type: string
          - type: 'null'
          title: Sex
        supported_languages:
          default: []
          items:
            type: string
          title: Supported Languages
          type: array
        verified:
          default: false
          title: Verified
          type: boolean
        voice_id:
          title: Voice Id
          type: integer
      required:
      - id
      - voice_id
      - name
      title: VoiceDetailInfo
      type: object
    Body_upload_voice_avatar_v1_voices__voice_id__avatar_put:
      properties:
        file:
          contentMediaType: application/octet-stream
          title: File
          type: string
      required:
      - file
      title: Body_upload_voice_avatar_v1_voices__voice_id__avatar_put
      type: object
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          title: Detail
          type: array
      title: HTTPValidationError
      type: object
    GeneratedSampleInfo:
      description: Stored sample location returned after free sample synthesis.
      properties:
        sample_s3_path:
          title: Sample S3 Path
          type: string
        sample_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Sample Url
      required:
      - sample_s3_path
      title: GeneratedSampleInfo
      type: object
    UpdateVoiceRequest:
      description: Request body for updating an existing voice (partial update).
      properties:
        age:
          anyOf:
          - type: string
          - type: 'null'
          title: Age
        category:
          anyOf:
          - type: string
          - type: 'null'
          title: Category
        description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Description
        generative_voice_description:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Generative Voice Description
        name:
          anyOf:
          - maxLength: 200
            minLength: 1
            type: string
          - type: 'null'
          title: Name
        quality:
          anyOf:
          - type: string
          - type: 'null'
          title: Quality
        sample_text:
          anyOf:
          - maxLength: 2000
            type: string
          - type: 'null'
          title: Sample Text
        sex:
          anyOf:
          - type: string
          - type: 'null'
          title: Sex
        supported_languages:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Supported Languages
      title: UpdateVoiceRequest
      type: object
    VoicesResponse:
      description: List of available voices.
      properties:
        limit:
          default: 20
          title: Limit
          type: integer
        offset:
          default: 0
          title: Offset
          type: integer
        total:
          default: 0
          title: Total
          type: integer
        voices:
          items:
            $ref: '#/components/schemas/VoiceInfo'
          title: Voices
          type: array
      required:
      - voices
      title: VoicesResponse
      type: object
    VoiceInfo:
      description: Voice metadata.
      properties:
        age:
          anyOf:
          - type: string
          - type: 'null'
          title: Age
        avatar_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Avatar Url
        category:
          default: cloned
          title: Category
          type: string
        description:
          anyOf:
          - type: string
          - type: 'null'
          title: Description
        handle:
          anyOf:
          - type: string
          - type: 'null'
          title: Handle
        id:
          title: Id
          type: integer
        name:
          title: Name
          type: string
        public_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Public Id
        quality:
          default: mid
          title: Quality
          type: string
        sample_url:
          anyOf:
          - type: string
          - type: 'null'
          title: Sample Url
        sex:
          anyOf:
          - type: string
          - type: 'null'
          title: Sex
        supported_languages:
          default: []
          items:
            type: string
          title: Supported Languages
          type: array
        voice_id:
          title: Voice Id
          type: integer
      required:
      - id
      - voice_id
      - name
      title: VoiceInfo
      type: object
  securitySchemes:
    ApiKeyHeader:
      description: Your API key in the `X-API-Key` header.
      in: header
      name: X-API-Key
      type: apiKey
    BearerAuth:
      description: 'Your API key as `Authorization: Bearer YOUR_API_KEY`.'
      scheme: bearer
      type: http
    ElevenLabsApiKey:
      description: Your KugelAudio API key in the ElevenLabs `xi-api-key` header.
      in: header
      name: xi-api-key
      type: apiKey
externalDocs:
  url: https://docs.kugelaudio.com/api-reference/introduction
